  <div class="page-header"><div class="container"><h1>Contact Us</h1><p>We'd love to hear from you.</p></div></div>
  <section><div class="container" style="max-width:560px;">
    <form data-demo>
      <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" required></div>
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label for="subject">Subject</label><select id="subject"><option>General Inquiry</option><option>Volunteering</option><option>Partnership</option><option>Donation Question</option></select></div>
      <div class="form-group"><label for="message">Message</label><textarea id="message" required></textarea></div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
    <div style="margin-top:2rem;color:var(--muted);font-size:0.9rem;">
      <p><strong>Email:</strong> casiousfoundation11@gmail.com</p>
      <p><strong>Phone:</strong> +254 700 000 000</p>
      <p><strong>Address:</strong> Nairobi, Kenya</p>
    </div>
  </div></section>
