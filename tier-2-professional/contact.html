<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Casious Foundation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">C</span>Casious Foundation</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a><a href="about.html">About</a><a href="programs.html">Programs</a>
        <a href="impact.html">Impact</a><a href="blog.html">News</a><a href="get-involved.html">Get Involved</a>
        <a href="contact.html" class="active">Contact</a><a href="donate.html" class="nav-donate">Donate</a>
      </nav>
    </div>
  </header>
  <div class="page-hero"><div class="container"><h1>Contact Us</h1><p>We respond within 24 hours.</p></div></div>
  <section><div class="container donate-grid">
    <form data-demo style="background:white;padding:2rem;border-radius:var(--radius);border:1px solid var(--border);">
      <div class="form-group"><label>Full Name</label><input type="text" required></div>
      <div class="form-group"><label>Email</label><input type="email" required></div>
      <div class="form-group"><label>Subject</label><select><option>General</option><option>Volunteering</option><option>Partnership</option><option>Media</option></select></div>
      <div class="form-group"><label>Message</label><textarea rows="5" required style="width:100%;padding:0.7rem;border:1px solid var(--border);border-radius:8px;font-family:inherit;"></textarea></div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
    <div>
      <h3 style="margin-bottom:1rem;">Reach Us</h3>
      <p style="color:var(--muted);margin-bottom:0.5rem;">📧 casiousfoundation11@gmail.com</p>
      <p style="color:var(--muted);margin-bottom:0.5rem;">📞 +254 700 000 000</p>
      <p style="color:var(--muted);margin-bottom:1.5rem;">📍 Nairobi, Kenya</p>
      <h3 style="margin-bottom:0.75rem;">Office Hours</h3>
      <p style="color:var(--muted);font-size:0.9rem;">Mon–Fri: 8am – 5pm<br>Sat: 9am – 1pm</p>
    </div>
  </div></section>
  <footer class="site-footer"><div class="container"><div class="footer-bottom"><span>&copy; 2026 Casious Foundation</span></div></div></footer>
  <script src="js/main.js"></script>
</body>
</html>
